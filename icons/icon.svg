<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#533483"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg-gradient)"/>
  
  <!-- Broken Chain Icon -->
  <g fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left chain link -->
    <ellipse cx="160" cy="256" rx="60" ry="80"/>
    
    <!-- Right chain link (broken/separated) -->
    <ellipse cx="352" cy="256" rx="60" ry="80"/>
    
    <!-- Break marks -->
    <line x1="230" y1="200" x2="282" y2="170"/>
    <line x1="230" y1="312" x2="282" y2="342"/>
    
    <!-- Sparkles/freedom marks -->
    <line x1="256" y1="120" x2="256" y2="90"/>
    <line x1="290" y1="130" x2="310" y2="105"/>
    <line x1="222" y1="130" x2="202" y2="105"/>
  </g>
  
  <!-- Check mark (success indicator) -->
  <circle cx="400" cy="400" r="60" fill="#00d9a5"/>
  <polyline points="370,400 390,420 430,380" fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
